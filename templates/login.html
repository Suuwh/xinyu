{% extends "base.html" %}
{% block title %}登录 · 心屿{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="card">
    <div class="auth-title">你好呀，欢迎回家 🌿</div>
    <div class="auth-sub">一个温暖、安全的情绪小角落</div>
    <form method="post">
      <label class="f">用户名</label>
      <input type="text" name="username" required>
      <label class="f">密码</label>
      <input type="password" name="password" required>
      <div style="margin-top:18px"><button class="btn" style="width:100%">进入心屿</button></div>
    </form>
    <p style="margin-top:14px;font-size:13px;color:#adb5bd;text-align:center">
      还没有账号？<a href="{{ url_for('register') }}">立即注册</a><br>
      演示咨询师：<b>counselor / 123456</b>
    </p>
  </div>
</div>
{% endblock %}
