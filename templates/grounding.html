{% extends "base.html" %}
{% block title %}5-4-3-2-1着陆 · 减压舱{% endblock %}
{% block body %}
<div class="card" style="max-width:720px;margin:0 auto">
  <h2>🖐️ 5-4-3-2-1 感官着陆法</h2>
  <p style="color:#868e96;font-size:14px">先做三个深呼吸，然后按顺序完成。在输入框里写下你当下真实看到/触到/听到的事物，把注意力拉回此刻。</p>
  <div id="steps">
    <div class="gstep" data-n="5">
      <div class="ghead"><span class="gnum">5</span> 说出你<b>看到</b>的 5 样东西</div>
      <input class="gin" placeholder="如：一扇窗、一本书、一盏台灯、水杯、绿植">
    </div>
    <div class="gstep" data-n="4">
      <div class="ghead"><span class="gnum">4</span> 感受你能<b>触摸</b>到的 4 种质感</div>
      <input class="gin" placeholder="如：衣服的柔软、桌面的光滑、水杯的冰凉、脚底踩地">
    </div>
    <div class="gstep" data-n="3">
      <div class="ghead"><span class="gnum">3</span> 聆听你<b>听到</b>的 3 种声音</div>
      <input class="gin" placeholder="如：自己的呼吸、空调声、远处的车流">
    </div>
    <div class="gstep" data-n="2">
      <div class="ghead"><span class="gnum">2</span> 闻一闻你能<b>闻到</b>的 2 种气味</div>
      <input class="gin" placeholder="如：洗衣液的清香、纸张的味道">
    </div>
    <div class="gstep" data-n="1">
      <div class="ghead"><span class="gnum">1</span> 觉察嘴里的 <b>1</b> 种味道</div>
      <input class="gin" placeholder="如：牙膏的薄荷味、水的甘甜">
    </div>
  </div>
  <div id="done" style="display:none;margin-top:16px;background:#d3f9d8;color:#2b8a3e;padding:16px;border-radius:12px;text-align:center">
    🌿 很好，你已经回到当下了。如果仍很难受，可以去<a href="{{ url_for('help_page') }}">求助资源</a>或找咨询师聊聊。
  </div>
  <div style="display:flex;gap:12px;justify-content:center;margin-top:18px">
    <button class="btn" onclick="document.getElementById('done').style.display='block';this.style.display='none'">完成着陆练习</button>
    <a class="btn btn-ghost" href="{{ url_for('relax') }}">返回减压舱</a>
  </div>
</div>
<style>
.gstep{margin:16px 0;padding:16px;background:#fff8f0;border-radius:14px}
.ghead{font-size:16px;margin-bottom:8px}
.gnum{display:inline-flex;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#ffd43b);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-right:8px}
.gin{margin-top:8px}
</style>
{% endblock %}
