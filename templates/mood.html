{% extends "base.html" %}
{% block title %}情绪日记 · 心隅{% endblock %}
{% block head %}<script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>{% endblock %}
{% block body %}
<div class="hero-banner">
  <h1>📔 我的情绪日记</h1>
  <p>每天花10秒记录心情，慢慢看见自己的变化。低谷时别硬扛，找咨询师聊聊。</p>
</div>

<div class="mood-layout">
  <!-- 左侧主区 -->
  <div class="mood-main">
    <div class="card">
      <h3>今天，感觉怎么样？</h3>
      <form method="post" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <label class="f" style="margin:0">心情</label>
        <div class="mood-pick">
          <span class="mood-icon" id="moodIcon">😄</span>
          <input type="hidden" name="mood" id="moodValue" value="5">
          <div class="mood-select" id="moodSelectWrap">
            <button type="button" class="mood-btn" id="moodBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="moodBtnText">超棒</span>
              <svg class="mood-caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="mood-menu" id="moodMenu" role="listbox">
              <button type="button" class="mood-opt" role="option" data-val="5">超棒</button>
              <button type="button" class="mood-opt" role="option" data-val="3">不错</button>
              <button type="button" class="mood-opt" role="option" data-val="1">一般</button>
              <button type="button" class="mood-opt" role="option" data-val="-1">有点低</button>
              <button type="button" class="mood-opt" role="option" data-val="-3">很难过</button>
              <button type="button" class="mood-opt" role="option" data-val="-5">撑不住</button>
            </div>
          </div>
        </div>
        <input type="text" name="note" placeholder="今天发生了什么？（可写）" style="flex:1;min-width:160px;margin-bottom:0;height:40px;min-height:40px">
        <button class="btn">记录</button>
      </form>
    </div>

    <div class="card">
      <div class="mood-chart-head">
        <h3 style="margin:0">心情变化曲线</h3>
        <div class="range-tabs">
          <button type="button" class="rtab active" data-range="week">近一周</button>
          <button type="button" class="rtab" data-range="month">近一月</button>
          <button type="button" class="rtab" data-range="year">近一年</button>
          <button type="button" class="rtab" data-range="all">全部</button>
        </div>
      </div>
      <div id="moodChart" style="width:100%;height:300px"></div>
      <p style="font-size:12px;color:var(--color-muted);margin-top:8px">曲线仅展示你亲手记录的心情值（-5 到 +5），用于观察自己的情绪起伏。</p>
    </div>

    <div class="card">
      <div class="mood-list-head">
        <h3 style="margin:0">心情记录</h3>
        <span id="listTitle" class="mood-list-tip">全部日期</span>
      </div>
      <div id="diaryList"></div>
      <p id="listEmpty" style="display:none;color:var(--color-muted);text-align:center;padding:20px">这一天还没有记录。</p>
    </div>
  </div>

  <!-- 右侧：往期日记侧栏 -->
  <aside class="mood-side">
    <div class="card mood-side-card">
      <h3>🗓 往期日记</h3>
      <div class="side-tabs">
        <button type="button" class="stab active" data-smode="day">按日</button>
        <button type="button" class="stab" data-smode="week">按周</button>
        <button type="button" class="stab" data-smode="month">按月</button>
        <button type="button" class="stab" data-smode="year">按年</button>
      </div>
      <p style="font-size:12px;color:var(--color-muted);margin:6px 0 10px">点击分组，查看那段时间的心事</p>
      <div id="sideDates"></div>
    </div>
  </aside>
</div>

<script>
var EMOJIS = {5: '😄', 3: '🙂', 1: '😐', 0: '😐', '-1': '🙁', '-3': '😢', '-5': '🌧'};
function emojiFor(v){ return EMOJIS[v] || '😐'; }

// 自定义心情下拉（普通按钮渲染文字可靠，规避原生 appearance:none 下拉按钮的文字渲染缺陷）
(function(){
  var wrap=document.getElementById('moodSelectWrap');
  var btn=document.getElementById('moodBtn');
  var btnText=document.getElementById('moodBtnText');
  var menu=document.getElementById('moodMenu');
  var hidden=document.getElementById('moodValue');
  var icon=document.getElementById('moodIcon');
  var opts=menu.querySelectorAll('.mood-opt');
  function openMenu(){ wrap.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
  function closeMenu(){ wrap.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  function apply(val, label){
    hidden.value=val;
    btnText.textContent=label;
    icon.textContent=emojiFor(val);
    for(var i=0;i<opts.length;i++){
      opts[i].classList.toggle('selected', opts[i].getAttribute('data-val')===String(val));
    }
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(wrap.classList.contains('open')) closeMenu(); else openMenu();
  });
  for(var i=0;i<opts.length;i++){
    opts[i].addEventListener('click', function(e){
      e.stopPropagation();
      apply(this.getAttribute('data-val'), this.textContent);
      closeMenu();
    });
  }
  document.addEventListener('click', function(){ closeMenu(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenu(); });
  apply(hidden.value, btnText.textContent);
})();

// 全量日记数据（后端渲染，最新在前）
var ALL_ROWS = [
  {% for r in rows %}
  {date: '{{ r.created_at.strftime("%Y-%m-%d") }}', time: '{{ r.created_at.strftime("%H:%M") }}', mood: {{ r.mood }}, note: {{ r.note|tojson }}},
  {% endfor %}
];
var CURRENT_DATE = null; // day 模式下选中的日期，null=全部
var SIDE_MODE = 'day';   // day | week | month | year
var SIDE_KEY = null;     // 当前筛选的聚合键

function parseDate(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

// ISO 周年周号，返回 [year, week]
function isoWeek(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  var yearStart = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  var week = Math.ceil((((t - yearStart) / 86400000) + 1)/7);
  return [t.getUTCFullYear(), week];
}

// 周起止日期标签，如 "10.06 - 10.12"
function weekRangeLabel(year, week){
  var jan4 = new Date(Date.UTC(year, 0, 4));
  var mon = new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (week - 1) * 7);
  var sun = new Date(mon);
  sun.setUTCDate(mon.getUTCDate() + 6);
  function fmt(dt){ return (dt.getUTCMonth()+1) + '.' + dt.getUTCDate(); }
  return fmt(mon) + ' - ' + fmt(sun);
}

function groupByDate(rows){
  var map = {}, order = [];
  rows.forEach(function(r){
    if (!map[r.date]) { map[r.date] = {date: r.date, items: [], moodSum: 0}; order.push(r.date); }
    map[r.date].items.push(r);
    map[r.date].moodSum += r.mood;
  });
  return order.map(function(d){ var g = map[d]; g.avg = Math.round(g.moodSum / g.items.length); return g; });
}

// 按 SIDE_MODE 聚合：返回 [{key, label, sub, items, avg, n}]
function aggregate(rows){
  if (SIDE_MODE === 'day') {
    return groupByDate(rows).map(function(g){
      var p = g.date.split('-');
      return {key: g.date, label: parseInt(p[2],10)+'日', sub: parseInt(p[1],10)+'月', items: g.items, avg: g.avg, n: g.items.length};
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = null, label = '', sub = '';
    if (SIDE_MODE === 'week'){
      var w = isoWeek(parseDate(r.date));
      key = w[0] + '-W' + w[1];
      label = weekRangeLabel(w[0], w[1]);
      sub = w[0] + '·W' + w[1];
    } else if (SIDE_MODE === 'month'){
      key = r.date.slice(0, 7);
      var p = r.date.split('-');
      label = parseInt(p[1],10) + '月';
      sub = p[0] + '年';
    } else { // year
      key = r.date.slice(0, 4);
      label = key + '年';
      sub = '';
    }
    if (!map[key]) { map[key] = {key: key, label: label, sub: sub, items: [], moodSum: 0}; order.push(key); }
    map[key].items.push(r);
    map[key].moodSum += r.mood;
  });
  return order.map(function(k){ var g = map[k]; g.avg = Math.round(g.moodSum / g.items.length); g.n = g.items.length; return g; });
}

function renderSide(){
  var groups = aggregate(ALL_ROWS);
  var el = document.getElementById('sideDates');
  el.innerHTML = '';
  groups.forEach(function(g){
    var active = false;
    if (SIDE_MODE === 'day') active = (CURRENT_DATE === g.date);
    else active = (SIDE_KEY === g.key);
    var btn = document.createElement('div');
    btn.className = 'side-date' + (active ? ' active' : '');
    var head = SIDE_MODE === 'day'
      ? '<span class="sd-day">'+g.label+'</span><span class="sd-ym">'+g.sub+'</span>'
      : '<span class="sd-day sd-day-wide">'+g.label+'</span>' +
        (SIDE_MODE === 'week' ? '' : '<span class="sd-ym">'+g.sub+'</span>');
    btn.innerHTML = head +
      '<span class="sd-emoji">'+emojiFor(g.avg)+'</span>'+
      '<span class="sd-n">'+g.n+'条</span>';
    btn.onclick = function(){
      if (SIDE_MODE === 'day'){
        CURRENT_DATE = (CURRENT_DATE === g.date ? null : g.date);
        SIDE_KEY = null;
      } else {
        SIDE_KEY = (SIDE_KEY === g.key ? null : g.key);
        CURRENT_DATE = null;
      }
      renderSide(); renderList();
    };
    el.appendChild(btn);
  });
  if (groups.length === 0) el.innerHTML = '<div style="color:var(--color-muted);font-size:13px;padding:10px 0">还没有日记，从今天开始吧。</div>';
}

// 主列表是否应包含该行
function passFilter(r){
  if (SIDE_MODE === 'day') return (!CURRENT_DATE) || r.date === CURRENT_DATE;
  if (!SIDE_KEY) return true;
  if (SIDE_MODE === 'week'){
    var w = isoWeek(parseDate(r.date));
    return (w[0] + '-W' + w[1]) === SIDE_KEY;
  }
  if (SIDE_MODE === 'month') return r.date.slice(0, 7) === SIDE_KEY;
  if (SIDE_MODE === 'year') return r.date.slice(0, 4) === SIDE_KEY;
  return true;
}

function renderList(){
  var rows = ALL_ROWS.filter(passFilter);
  var el = document.getElementById('diaryList');
  var tip = '全部日期';
  if (SIDE_MODE === 'day' && CURRENT_DATE) tip = '📅 ' + CURRENT_DATE;
  else if (SIDE_MODE === 'week' && SIDE_KEY){
    var pp = SIDE_KEY.split('-W'); tip = '🗓 第' + pp[1] + '周（' + weekRangeLabel(+pp[0], +pp[1]) + '）';
  }
  else if (SIDE_MODE === 'month' && SIDE_KEY) tip = '🗓 ' + SIDE_KEY;
  else if (SIDE_MODE === 'year' && SIDE_KEY) tip = '🗓 ' + SIDE_KEY + '年';
  document.getElementById('listTitle').textContent = tip;
  document.getElementById('listEmpty').style.display = rows.length ? 'none' : '';
  el.innerHTML = '';
  groupByDate(rows).forEach(function(g){
    var sec = document.createElement('div');
    sec.className = 'diary-day';
    var head = '<div class="diary-day-head"><b>'+g.date+'</b><span>'+g.items.length+'条 · 当日平均 '+emojiFor(g.avg)+'</span></div>';
    var items = g.items.map(function(r){
      return '<div class="diary-item"><span class="diary-emoji">'+emojiFor(r.mood)+'</span>'+
        '<div class="diary-body"><span class="diary-time">'+r.time+'</span>'+
        '<p>'+(r.note ? r.note : '<i style="color:var(--color-muted)">（未写备注）</i>')+'</p></div></div>';
    }).join('');
    sec.innerHTML = head + items;
    el.appendChild(sec);
  });
}

// ---- 曲线（周/月/年/全部，只含自己选择的心情）----
function _initChart(el){
  var ch = echarts.init(el, null, {width: el.clientWidth, height: el.clientHeight || 300});
  setTimeout(function(){ ch.resize(); }, 60);
  window.addEventListener('resize', function(){ ch.resize(); });
  return ch;
}
var chart = null;
function loadChart(range){
  fetch('/api/mood?range=' + range).then(function(r){ return r.json(); }).then(function(d){
    if (!chart) chart = _initChart(document.getElementById('moodChart'));
    chart.setOption({
      backgroundColor: 'transparent',
      title: {text: '心情变化曲线（-5 ~ +5）', subtext: {week:'近7天',month:'近30天',year:'近365天',all:'全部记录'}[range] + ' · 数值为你亲自选择的心情',
              textStyle: {fontSize: 15}, subtextStyle: {fontSize: 11, color: '#787069'}},
      tooltip: {trigger: 'axis', triggerOn: 'click', renderMode: 'richText', confine: true,
        formatter: function(ps){
          var i = ps[0].dataIndex, nl = String.fromCharCode(10);
          var date = (d.dates && d.dates[i]) ? d.dates[i] : d.labels[i];
          var v = d.vals[i];
          if(v === null || v === undefined) return date + nl + '当天未记录心情';
          return date + nl + '心情值：' + v + '（-5 ~ +5）';
        }},
      grid: {left: 42, right: 22, top: 78, bottom: 34, containLabel: true},
      xAxis: {type: 'category', boundaryGap: false, data: d.labels,
              axisLabel: {fontSize: 11, hideOverlap: true}},
      yAxis: {type: 'value', min: -5, max: 5, splitNumber: 5},
      series: [{
        name: '心情', type: 'line', data: d.vals, smooth: true, connectNulls: false,
        symbol: 'circle', symbolSize: 8, showSymbol: true,
        lineStyle: {color: '#c44039', width: 3}, itemStyle: {color: '#c44039'},
        areaStyle: {color: 'rgba(196,64,57,.12)'},
        markLine: {silent: true, symbol: 'none', lineStyle: {color: '#787069', type: 'dashed'},
          data: [{yAxis: 0, label: {formatter: '平静线', color: '#787069', fontSize: 10}}]}
      }]
    }, true);
  });
}

document.querySelectorAll('.rtab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.rtab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    loadChart(btn.dataset.range);
  });
});

// 侧栏分组模式切换（按日/周/月/年）
document.querySelectorAll('.stab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.stab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    SIDE_MODE = btn.dataset.smode;
    SIDE_KEY = null;
    CURRENT_DATE = null;
    renderSide(); renderList();
  });
});

renderSide();
renderList();
loadChart('week');
</script>

<style>
.mood-pick{display:flex;align-items:center;gap:8px}
.mood-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;background:var(--color-error-soft);border-radius:50%;flex-shrink:0}
.mood-select{position:relative;display:inline-block;min-width:130px}
.mood-btn{width:100%;height:40px;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:var(--color-cotton);border:1px solid var(--color-rule);border-radius:var(--radius-input);color:var(--color-ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,1);transition:border-color .15s,box-shadow .15s}
.mood-btn:hover{border-color:var(--color-rule-2)}
.mood-select.open .mood-btn{border-color:var(--color-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--color-accent) 16%,transparent)}
.mood-caret{flex-shrink:0;color:var(--color-muted);transition:transform .18s var(--ease-out)}
.mood-select.open .mood-caret{transform:rotate(180deg)}
.mood-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:var(--color-cotton);border:1px solid var(--color-rule);border-radius:var(--radius-input);box-shadow:var(--shadow-pop);padding:4px;z-index:60;display:none}
.mood-select.open .mood-menu{display:block}
.mood-opt{width:100%;display:block;text-align:left;padding:8px 10px;border:none;background:transparent;border-radius:8px;color:var(--color-ink-2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.mood-opt:hover{background:var(--color-error-soft);color:var(--color-ink)}
.mood-opt.selected{background:var(--color-error-soft);color:var(--color-accent-2);font-weight:700}
.mood-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.mood-main{min-width:0}
.mood-side{position:sticky;top:12px}
.mood-side-card{max-height:calc(100vh - 120px);overflow-y:auto}
.mood-chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.range-tabs{display:flex;background:var(--color-error-soft);border-radius:var(--radius-card);padding:3px;gap:2px}
.rtab{border:none;background:transparent;padding:6px 14px;border-radius:var(--radius-card);font-size:13px;font-weight:600;color:var(--color-muted);cursor:pointer;transition:.15s}
.rtab.active{background:var(--color-error);color:var(--color-cotton)}
.mood-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mood-list-tip{font-size:12.5px;color:var(--color-muted)}
.side-date{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-card);cursor:pointer;transition:.15s;border:1px solid transparent;flex-wrap:wrap}
.side-date:hover{background:var(--color-error-soft)}
.side-date.active{background:var(--color-error-soft);border-color:var(--color-error)}
.sd-day{min-width:34px;height:34px;padding:0 6px;white-space:nowrap;border-radius:var(--radius-card);background:var(--color-error-soft);color:var(--color-warn);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sd-ym{font-size:12.5px;color:var(--color-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-emoji{font-size:18px;flex-shrink:0}
.sd-n{font-size:11.5px;color:var(--color-muted);background:var(--color-paper-2);border-radius:var(--radius-card);padding:2px 7px;flex-shrink:0}
.side-tabs{display:flex;background:var(--color-error-soft);border-radius:var(--radius-card);padding:3px;gap:2px;margin-bottom:4px}
.stab{border:none;background:transparent;padding:5px 0;flex:1;border-radius:var(--radius-input);font-size:12px;font-weight:600;color:var(--color-muted);cursor:pointer;transition:.15s}
.stab.active{background:var(--color-error);color:var(--color-cotton)}
.sd-day-wide{width:auto;min-width:0;height:auto;min-height:34px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;border-radius:var(--radius-card);background:var(--color-error-soft);color:var(--color-warn);flex-shrink:0}
.diary-day{background:var(--color-warn-soft);border:1px solid var(--color-error-soft);border-radius:var(--radius-card);padding:12px 14px;margin-bottom:12px}
.diary-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--color-muted)}
.diary-day-head b{color:var(--color-warn);font-size:14px}
.diary-item{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--color-error-soft)}
.diary-item:first-of-type{border-top:none}
.diary-emoji{font-size:22px}
.diary-body{flex:1;min-width:0}
.diary-time{font-size:11.5px;color:var(--color-muted)}
.diary-body p{font-size:13.5px;color:var(--color-ink-2);line-height:1.7;margin:3px 0 0}
@media (max-width: 900px){
  .mood-layout{grid-template-columns:1fr}
  .mood-side{position:static}
}
</style>
{% endblock %}
